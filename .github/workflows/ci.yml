name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux / stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check generated bindings
        run: cargo --locked xtask check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Test workspace libraries
        run: cargo test --locked --workspace --lib
      - name: Cache CPU PJRT plugin archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/rxla-ci/zml-cpu-linux-amd64.tar.zst
          key: zml-cpu-linux-amd64-f1670d21
      - name: Prepare CPU PJRT plugin
        env:
          URL: https://mirror.zml.ai/plugins/202609101243.20.1.7ca6884ea2cb/zml-cpu-linux-amd64.tar.zst
          ARCHIVE_SHA256: f1670d21b92102b8c7c7f9d0f00d6a7a1a5d90a83d7e28ba5fbeb1f9ce4c170c
        run: |
          set -eu
          archive="$HOME/.cache/rxla-ci/zml-cpu-linux-amd64.tar.zst"
          mkdir -p "$(dirname "$archive")" "$RUNNER_TEMP/rxla-pjrt"
          if ! test -f "$archive"; then
            curl --fail --location --retry 3 "$URL" --output "$archive"
          fi
          echo "$ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --use-compress-program=unzstd -xf "$archive" -C "$RUNNER_TEMP/rxla-pjrt"
      - name: Test CPU PJRT execution
        run: |
          plugin="$RUNNER_TEMP/rxla-pjrt/libzml_cpu.so"
          echo "d0d2c537cfa37ed36f15a6de056fa2a6c12d0d1c036214c26cb5276f941f4509  $plugin" | sha256sum --check --strict
          PJRT_CPU_PLUGIN_PATH="$plugin" sh scripts/check-cpu.sh
