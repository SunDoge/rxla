[project]
name = "rxla"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "diffusers>=0.35,<0.36",
    "hydra-core>=1.3,<2",
    "ipython>=9.17.1",
    "iopath>=0.1.10,<0.2",
    "jax[cuda13]>=0.11.1",
    "loguru>=0.7.3",
    "numpy>=2.3",
    "pydantic>=2.13.5",
    "safetensors>=0.8,<0.9",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.12.1",
    "typed-args>=0.9.0",
    "einops>=0.8,<0.9",
    "accelerate>=1.13,<2",
    "kernels>=0.12,<0.13",
    "pylance>=11.0.0",
    "pyfory[format]>=1.7,<1.8",
    "tfrecord-slow[crc32c]>=0.6,<0.7",
    "pycocotools>=2.0.10,<3",
    "rxla-log",
]

[tool.uv]
package = false

[tool.uv.sources]
rxla-log = { path = "python/rxla-log", editable = true }
diffusers = { git = "https://github.com/huggingface/diffusers.git" }

[dependency-groups]
qwen-bench = [
    "diffusers",
    "transformers>=5.17",
]
