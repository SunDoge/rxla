[package]
name = "rxla-onnx"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "ONNX import into the RXLA intermediate representation"

[dependencies]
onnx-ir = { version = "=0.22.0-pre.3", default-features = false }
protobuf = "3.7.2"
