rxla-pjrt = { path = "../rxla-pjrt", version = "=0.1.0-alpha.1" }
snafu.workspace = true

[dev-dependencies]
clap.workspace = true
rxla-core = { path = "../rxla-core", version = "=0.1.0-alpha.1" }
rxla-safetensors = { path = "../rxla-safetensors", version = "=0.1.0-alpha.1" }
