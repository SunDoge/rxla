[package]
name = "rxla"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rust-native tensor and neural-network API targeting OpenXLA through PJRT"

[dependencies]
rxla-ir = { path = "../rxla-ir", version = "=0.1.0-alpha.1" }
rxla-nn = { path = "../rxla-nn", version = "=0.1.0-alpha.1" }
rxla-pjrt = { path = "../rxla-pjrt", version = "=0.1.0-alpha.1" }
rxla-core = { path = "../rxla-core", version = "=0.1.0-alpha.1", default-features = false }

[dev-dependencies]
clap = { workspace = true, features = ["env"] }
