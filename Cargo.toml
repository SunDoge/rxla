[workspace]
resolver = "3"
members = [
  "crates/rxla",
  "crates/rxla-cache",
  "crates/rxla-core",
  "crates/rxla-ir",
  "crates/rxla-models",
  "crates/rxla-nn",
  "crates/rxla-onnx",
  "crates/rxla-pjrt",
  "crates/rxla-train",
  "crates/rxla-safetensors",
  "crates/rxla-xla-proto",
  "xtask",
]
default-members = ["crates/rxla"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.6.6", features = ["derive"] }
cranelift-entity = "0.134.1"
dlpark = { version = "=0.9.0-beta.1", default-features = false, features = ["half", "image"] }
half = { version = "2.7.1", default-features = false }
image = { version = "0.25.10", default-features = false }
snafu = "0.9.2"

[profile.dev.package."*"]
opt-level = 2
