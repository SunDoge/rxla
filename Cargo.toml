[workspace]
resolver = "3"
members = [
  "crates/rxla",
  "crates/rxla-cache",
  "crates/rxla-core",
  "crates/rxla-ir",
  "crates/rxla-log",
  "crates/rxla-models",
  "crates/rxla-nn",
  "crates/rxla-onnx",
  "crates/rxla-pjrt",
  "crates/rxla-train",
  "crates/rxla-safetensors",
  "crates/rxla-tfrecord",
  "crates/rxla-xla-proto",
  "xtask",
]
default-members = ["crates/rxla"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SunDoge/rxla"
readme = "README.md"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.6.6", features = ["derive"] }
cranelift-entity = "0.134.1"
dlpark = { version = "=0.9.0-beta.3", default-features = false, features = ["half", "image"] }
derive_setters = "0.1.9"
fast_image_resize = "6.1.0"
half = { version = "2.7.1", default-features = false }
fory = "=1.7.3"
rayon = "1.11.0"
image = { version = "0.25.10", default-features = false }
memmap2 = "0.9.11"
mcap = "0.25.0"
prost = "0.14"
snafu = "0.9.2"
tfrecord-lite = { version = "0.1.0", path = "../tfrecord-fast" }
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[profile.dev.package."*"]
opt-level = 2
