[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxla-log"
version = "0.1.0a1"
description = "Structured, indexed training logs backed by MCAP"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "mcap>=1.3,<2",
  "protobuf>=6.31,<8",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/rxla_log"]
