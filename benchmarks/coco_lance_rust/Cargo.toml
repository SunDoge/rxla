[package]
name = "coco-lance-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lance = { version = "11.0.0", default-features = false }
rand = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
strip = true
