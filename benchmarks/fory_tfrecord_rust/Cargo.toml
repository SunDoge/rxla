[package]
name = "fory-tfrecord-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
crc32c = "0.6.8"
crossbeam-channel = "0.5.15"
fory = "=1.7.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
lto = "thin"
strip = true
